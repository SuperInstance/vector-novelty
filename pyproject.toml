[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vector-novelty"
version = "0.1.0"
description = "Centroid-based novelty scoring for agent populations — pure NumPy, O(n) diversity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Cocapn Fleet", email = "fleet@cocapn.dev" },
]
keywords = ["novelty", "diversity", "agent", "evolution", "vector", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/vector-novelty"
Repository = "https://github.com/SuperInstance/vector-novelty"
Issues = "https://github.com/SuperInstance/vector-novelty/issues"

[tool.hatch.build.targets.wheel]
packages = ["vector_novelty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
